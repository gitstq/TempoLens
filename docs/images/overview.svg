<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b0e14"/>
      <stop offset="1" stop-color="#10182b"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" rx="16" fill="url(#bg)"/>

  <!-- 顶栏 / top bar -->
  <rect x="24" y="20" width="592" height="40" rx="10" fill="#11151f" stroke="#232c3f"/>
  <circle cx="48" cy="40" r="9" fill="#7c9eff"/>
  <rect x="48" y="35" width="2" height="10" fill="#0b0e14"/>
  <text x="66" y="45" fill="#e8edf6" font-size="14" font-weight="700">TempoLens</text>
  <text x="140" y="45" fill="#6b7690" font-size="10">零依赖 · 可离线 · 本地优先</text>
  <rect x="470" y="29" width="60" height="22" rx="6" fill="#161c2a" stroke="#232c3f"/>
  <text x="486" y="44" fill="#a7b2c8" font-size="10">简体中文</text>
  <rect x="538" y="29" width="62" height="22" rx="6" fill="#161c2a" stroke="#232c3f"/>
  <text x="554" y="44" fill="#a7b2c8" font-size="10">深色主题</text>

  <!-- 舞台 / stage -->
  <rect x="24" y="76" width="592" height="180" rx="14" fill="#11151f" stroke="#232c3f"/>

  <!-- 播放按钮 / play button -->
  <rect x="48" y="100" width="118" height="46" rx="12" fill="#7c9eff"/>
  <polygon points="76,114 100,123 76,132" fill="#0b0e14"/>
  <text x="108" y="128" fill="#0b0e14" font-size="14" font-weight="700">开始</text>

  <!-- Tap 按钮 / tap button -->
  <rect x="178" y="100" width="112" height="46" rx="12" fill="#161c2a" stroke="#232c3f"/>
  <text x="206" y="128" fill="#e8edf6" font-size="13" font-weight="600">👋 打拍测速</text>

  <!-- BPM 显示 / bpm readout -->
  <text x="592" y="132" fill="#e8edf6" font-size="44" font-weight="800" text-anchor="end">100</text>
  <text x="588" y="132" fill="#6b7690" font-size="11" font-weight="600" text-anchor="end" dy="18">BPM</text>

  <!-- 滑杆 / slider -->
  <rect x="48" y="160" width="480" height="6" rx="3" fill="#1c2434"/>
  <rect x="48" y="160" width="290" height="6" rx="3" fill="#7c9eff"/>
  <circle cx="338" cy="163" r="9" fill="#7c9eff" stroke="#11151f" stroke-width="3"/>

  <!-- 视觉区 / visualizer -->
  <rect x="48" y="188" width="544" height="52" rx="10" fill="#161c2a" stroke="#232c3f"/>
  <line x1="320" y1="196" x2="320" y2="216" stroke="#7c9eff" stroke-width="2"/>
  <circle cx="320" cy="222" r="5" fill="#7c9eff"/>
  <circle cx="256" cy="206" r="5" fill="#7c9eff"/>
  <circle cx="384" cy="206" r="5" fill="#1c2434" stroke="#31405a"/>
  <circle cx="448" cy="206" r="5" fill="#1c2434" stroke="#31405a"/>
  <circle cx="192" cy="206" r="5" fill="#1c2434" stroke="#31405a"/>
  <text x="300" y="234" fill="#e8edf6" font-size="18" font-weight="800">1</text>
  <text x="312" y="234" fill="#6b7690" font-size="14" font-weight="700">.</text>
  <text x="320" y="234" fill="#a7b2c8" font-size="15" font-weight="700">1</text>

  <!-- 卡片 / cards -->
  <rect x="24" y="272" width="188" height="104" rx="12" fill="#11151f" stroke="#232c3f"/>
  <rect x="36" y="286" width="20" height="20" rx="6" fill="rgba(124,158,255,0.14)"/>
  <text x="44" y="301" fill="#7c9eff" font-size="11">🕐</text>
  <text x="64" y="301" fill="#a7b2c8" font-size="11" font-weight="600">拍号与细分</text>
  <rect x="36" y="316" width="164" height="26" rx="6" fill="#161c2a" stroke="#232c3f"/>
  <text x="46" y="333" fill="#a7b2c8" font-size="10">每小节拍数</text>
  <text x="186" y="333" fill="#e8edf6" font-size="10" text-anchor="end">4</text>
  <rect x="36" y="348" width="164" height="26" rx="6" fill="#161c2a" stroke="#232c3f"/>
  <text x="46" y="365" fill="#a7b2c8" font-size="10">音符细分</text>
  <text x="186" y="365" fill="#e8edf6" font-size="10" text-anchor="end">四分音符</text>

  <rect x="224" y="272" width="188" height="104" rx="12" fill="#11151f" stroke="#232c3f"/>
  <rect x="236" y="286" width="20" height="20" rx="6" fill="rgba(124,158,255,0.14)"/>
  <text x="244" y="301" fill="#7c9eff" font-size="11">🔊</text>
  <text x="264" y="301" fill="#a7b2c8" font-size="11" font-weight="600">音色</text>
  <rect x="236" y="316" width="164" height="26" rx="6" fill="#161c2a" stroke="#232c3f"/>
  <text x="246" y="333" fill="#a7b2c8" font-size="10">音色</text>
  <text x="386" y="333" fill="#e8edf6" font-size="10" text-anchor="end">电子咔哒</text>
  <rect x="236" y="348" width="164" height="26" rx="6" fill="#161c2a" stroke="#232c3f"/>
  <text x="246" y="365" fill="#a7b2c8" font-size="10">音量</text>
  <text x="386" y="365" fill="#7c9eff" font-size="10" text-anchor="end">70%</text>

  <rect x="424" y="272" width="192" height="104" rx="12" fill="#11151f" stroke="#232c3f"/>
  <rect x="436" y="286" width="20" height="20" rx="6" fill="rgba(124,158,255,0.14)"/>
  <text x="444" y="301" fill="#7c9eff" font-size="11">🎚️</text>
  <text x="464" y="301" fill="#a7b2c8" font-size="11" font-weight="600">复节奏</text>
  <rect x="436" y="314" width="168" height="18" rx="9" fill="#7c9eff" opacity="0.25"/>
  <circle cx="552" cy="323" r="7" fill="#7c9eff"/>
  <text x="436" y="348" fill="#a7b2c8" font-size="10">节奏比（如 3:2）</text>
  <rect x="436" y="354" width="168" height="20" rx="6" fill="#161c2a" stroke="#232c3f"/>
  <text x="446" y="368" fill="#e8edf6" font-size="11" font-weight="600">3:2</text>
</svg>
